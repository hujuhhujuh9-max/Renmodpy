name: Validate RenModPy

on:
  push:
    branches: [main, 'bootstrap/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Python state and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -t . -v
      - run: python3 -m compileall -q engine/python prepare.py build_sdk.py scripts/check_native.py

  native:
    name: Native Ren'Py save and screen checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-lfs patch xvfb libegl1 libgl1-mesa-dri libsdl2-2.0-0
      - name: Assemble pinned engine and RAPT
        run: python3 build_sdk.py
      - name: Compile, lint, render, save, restart and check Android distribution
        run: xvfb-run -a -s '-screen 0 1080x1920x24' python3 scripts/check_native.py --sdk .renmodpy-build/renmodpy-sdk
      - name: Check headless software rendering and save continuity
        run: SDL_VIDEODRIVER=dummy RENPY_RENDERER=sw python3 scripts/check_native.py --sdk .renmodpy-build/renmodpy-sdk --output .renmodpy-build/native-check-software
      - name: Upload native check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-check
          path: |
            .renmodpy-build/native-check/*.log
            .renmodpy-build/native-check/*.json
            .renmodpy-build/native-check/*.png
            .renmodpy-build/native-check-software/*.log
            .renmodpy-build/native-check-software/*.json
            .renmodpy-build/native-check-software/*.png
            .renmodpy-build/renmodpy-sdk/renmodpy-build.json
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android APK and emulator checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@2a69be27b0baa8a7ec1c0ba665dc022b180664c5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y git-lfs patch libegl1 libgl1-mesa-dri libsdl2-2.0-0
          sudo chmod 666 /dev/kvm
      - name: Assemble the engine and build the validation APK
        run: |
          python3 build_sdk.py
          python3 scripts/build_android_check.py --sdk .renmodpy-build/renmodpy-sdk
      - name: Install and exercise the APK on Android
        uses: ReactiveCircus/android-emulator-runner@ed009f5318f15b1cf93a191b856c4f1748a2d4c1
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/check_android.py
      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-emulator-check
          path: |
            .renmodpy-build/android-build/build.log
            .renmodpy-build/android-build/build.json
            .renmodpy-build/android-check/
          if-no-files-found: warn
          retention-days: 14
